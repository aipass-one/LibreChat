<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 252 64" role="img" aria-labelledby="title">
  <title id="title">AI Pass</title>
  <style>
    .wordmark { fill: #171717; }
    @media (prefers-color-scheme: dark) { .wordmark { fill: #ffffff; } }
  </style>
  <defs>
    <clipPath id="tile">
      <rect x="8" y="8" width="48" height="48" rx="15" ry="15" />
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="8" y="8" width="48" height="48" fill="#4F46E5" />
    <polygon points="8,8 27.9,8 42,22 8,56" fill="#FFFFFF" fill-opacity="0.15" />
  </g>
  <text
    x="32"
    y="39"
    text-anchor="middle"
    font-family="Outfit, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="25"
    font-weight="800"
    letter-spacing="-1.2"
    fill="#FFFFFF"
  >AI</text>
  <text
    x="70"
    y="43"
    font-family="Outfit, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="32"
    font-weight="750"
    letter-spacing="-1.2"
    class="wordmark"
  >AI Pass</text>
</svg>
