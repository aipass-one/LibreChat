name: AI Pass authentication hotfix

on:
  push:
    branches: [fix/oauth-callback-no-session-20261112]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.auth-hotfix
          platforms: linux/arm64
          push: true
          tags: ghcr.io/aipass-one/librechat:sha-${{ github.sha }}
          build-args: SOURCE_REVISION=${{ github.sha }}
